<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#02040a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <title>INTRUDER</title>
  <style>
    html, body { margin: 0; height: 100%; background: #02040a; overflow: hidden; }
    #boot { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #02040a; color: #9ff5ea; font: 13px/1.5 system-ui, sans-serif; letter-spacing: .3em; text-align: center; padding: 0 8vw; }
    #boot h1 { margin: 0; font-size: 30px; font-weight: 300; letter-spacing: .45em; padding-left: .45em; color: #e4fffa; }
    #boot button { margin-top: 8px; padding: 12px 26px; color: #e4fffa; background: rgba(30,130,120,.35); border: 1px solid rgba(159,245,234,.6); font: inherit; }
  </style>
</head>
<body>
  <div id="boot"><h1>INTRUDER</h1><div id="boot-msg">LOADING</div></div>
  <script>
    // Failures are shown on screen, because a phone has no console to read them in.
    (function () {
      var boot = document.getElementById('boot');
      window.__bootDone = function () { boot.style.display = 'none'; window.__booted = true; };
      window.__bootFail = function (msg) {
        (window.__errors = window.__errors || []).push(String(msg));
        if (window.__booted) return;
        boot.innerHTML = '<h1>INTRUDER</h1><div style="letter-spacing:.05em;max-width:80vw">' + String(msg).replace(/</g, '&lt;') + '</div><button onclick="location.reload()">RELOAD</button>';
      };
      window.addEventListener('error', function (e) { window.__bootFail('Error: ' + (e.message || 'a file failed to load')); }, true);
      window.addEventListener('unhandledrejection', function (e) { window.__bootFail('Error: ' + ((e.reason && e.reason.message) || e.reason)); });
    })();
  </script>
  <canvas id="view"></canvas>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
